name: test-suite

# Roda a suite offline (FakeLLM, sem rede e sem modelo) em cada sistema.
# Motivo: antes disso o unico CI era o empacotamento - um erro de teste so
# aparecia quando alguem rodava na mao, e o binario saia mesmo assim.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Rodar a suite offline
        env:
          # Terminal do CI tambem e UTF-8: evita quebra de acento no Windows.
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python tests/test_smoke.py
