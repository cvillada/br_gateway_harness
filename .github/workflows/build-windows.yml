name: build-desktop-exes
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Build single-file exe
        run: >
          pyinstaller --onefile --clean --noconfirm --log-level=WARN
          --name motor.exe
          --icon bgh/assets/teo.ico
          --add-data "bgh/skills_default;bgh/skills_default"
          --add-data "bgh/assets;bgh/assets"
          --collect-all vosk --collect-all sounddevice --hidden-import cffi
          motor_entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: motor-windows-exe
          path: dist/motor.exe

  macos-binary:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Build single-file binary (macOS)
        run: >
          pyinstaller --onefile --clean --noconfirm --log-level=WARN
          --name motor-macos
          --add-data "bgh/skills_default:bgh/skills_default"
          --add-data "bgh/assets:bgh/assets"
          --collect-all vosk --collect-all sounddevice --hidden-import cffi
          motor_entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: motor-macos
          path: dist/motor-macos
