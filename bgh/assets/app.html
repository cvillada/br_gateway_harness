<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>TEO</title>
<link rel="icon" href="/teo.png">
<link rel="stylesheet" href="/app.css">
</head>
<body data-tema="claro">

<div id="faixa-rede" class="faixa-rede" hidden></div>

<header class="topo">
  <div class="marca">
    <img class="gato" src="/teo.svg" alt="" width="64" height="64">
    <div class="marca-texto">
      <h1 id="titulo">TEO</h1>
      <p id="sub" class="sub"></p>
    </div>
  </div>
  <div class="acoes-topo">
    <span id="passo" class="passo" hidden></span>
    <button id="ajuda" class="botao-fantasma" type="button"></button>
    <button id="terminal" class="botao-fantasma" type="button"></button>
    <button id="sair" class="botao-fantasma" type="button"></button>
  </div>
</header>

<main class="tela">
  <section id="conversa" class="conversa" aria-live="polite" aria-relevant="additions text">
    <p id="vazio" class="vazio"></p>
  </section>

  <aside class="painel" aria-labelledby="painel-titulo">
    <h2 class="painel-titulo" id="painel-titulo"></h2>
    <ol id="ferramentas" class="ferramentas"></ol>
    <div class="ctx">
      <div class="ctx-topo">
        <span id="ctx-titulo"></span>
        <span id="ctx-pct" class="ctx-pct"></span>
      </div>
      <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="ctx-barra" class="barra-cheia"></div>
      </div>
      <p id="ctx-texto" class="ctx-texto"></p>
    </div>
  </aside>
</main>

<footer class="rodape">
  <!-- Aviso de "TEO trabalhando": fica ACIMA da linha de digitar, sempre no
       mesmo lugar, com rodinha, texto e barra em movimento. A frase da dica
       (rodape) continua sendo o aviso de que o recado chega no meio do turno;
       esta faixa e o sinal de que o TEO esta VIVO e ocupado. -->
  <div id="trabalhando" class="trabalhando" role="status" aria-live="polite" hidden>
    <div class="trabalhando-linha">
      <span class="rodinha" aria-hidden="true"></span>
      <span id="trabalhando-texto" class="trabalhando-texto"></span>
      <span id="trabalhando-tempo" class="trabalhando-tempo" aria-hidden="true"></span>
    </div>
    <div class="trilho-trabalho" aria-hidden="true"><span class="trilho-luz"></span></div>
  </div>
  <div class="linha-digitar">
    <label class="oculto" for="texto" id="rotulo-texto"></label>
    <textarea id="texto" rows="1" autocomplete="off" spellcheck="true"></textarea>
    <button id="enviar" class="botao-enviar" type="button"></button>
  </div>
  <!-- Clipe de anexo: fica EMBAIXO da linha de digitar (pedido do dono), a
       esquerda, e cresce para a direita com os arquivos escolhidos. O rotulo
       do botao vem do i18n por JS (aria-label + title): aqui nao ha texto. -->
  <div class="linha-anexo">
    <button id="clipe" class="botao-clipe" type="button">
      <svg class="clipe-desenho" viewBox="0 0 24 24" width="22" height="22"
           aria-hidden="true" focusable="false">
        <path d="M8.5 12.5l5.9-5.9a3 3 0 0 1 4.2 4.2l-8 8a5 5 0 0 1-7.1-7.1l7.6-7.6"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
    <input id="arquivo" type="file" multiple hidden>
    <ul id="anexos" class="anexos" hidden></ul>
    <!-- A dica mora NESTA linha (com o clipe), e nao numa linha propria: no
         notebook pequeno cada linha do rodape come altura da conversa. -->
    <p id="dica" class="dica"></p>
  </div>
</footer>

<div id="veu" class="veu" hidden>
  <div class="cartao-modal" role="dialog" aria-modal="true" aria-labelledby="m-titulo">
    <h2 id="m-titulo" class="m-titulo"></h2>
    <p id="m-dica" class="m-dica"></p>
    <p id="m-label" class="m-label"></p>
    <pre id="m-detalhe" class="m-detalhe"></pre>
    <div id="m-opcoes" class="m-opcoes"></div>
    <div id="m-campo" class="m-campo" hidden>
      <input id="m-texto" class="m-texto" type="text" autocomplete="off">
      <button id="m-ok" class="botao-enviar" type="button"></button>
    </div>
  </div>
</div>

<div id="veu-fim" class="veu" hidden>
  <div class="cartao-modal" role="dialog" aria-modal="true" aria-labelledby="fim-titulo">
    <img class="gato gato-fim" src="/teo.svg" alt="" width="88" height="88">
    <h2 id="fim-titulo" class="m-titulo"></h2>
    <p id="fim-texto" class="m-label"></p>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
